<div class="backg">
    <div class="title" (click)="goHome()">
        <span class="waste-title">Waste</span>
    </div>

    <div *ngIf="loading" class="loader">
        <mat-spinner class="loader-spiner"></mat-spinner>
    </div>

    <div *ngIf="!loading" class="dialog-box">

        <div class="box-title">
            <span>Redefinir senha</span>
        </div>

        <form>
            <div class="txt-input-div">
                <mat-form-field appearance="legacy">
                    <mat-label>Confirme seu email</mat-label>
                    <input matInput [formControl]="emailFormControl" placeholder="email cadastrado">
                    <mat-error *ngIf="emailFormControl.hasError('email') && !emailFormControl.hasError('required')">
                        Digite um email valido
                    </mat-error>
                    <mat-error *ngIf="emailFormControl.hasError('required')">
                        Email é <strong>obrigatório</strong>
                    </mat-error>
                    <mat-error *ngIf="emailFormControl.hasError('emailMatchValidation')">
                        Email incorreto
                    </mat-error>
                    <mat-icon matSuffix>email</mat-icon>
                </mat-form-field>
            </div>
            <div class="txt-input-div">
                <mat-form-field appearance="legacy">
                    <mat-label>Nova senha</mat-label>
                    <input matInput type="password" placeholder="******">
                    <mat-icon matSuffix>lock</mat-icon>
                </mat-form-field>
            </div>
            <div class="txt-input-div">
                <mat-form-field appearance="legacy">
                    <mat-label>Confirme a nova senha</mat-label>
                    <input matInput type="password" placeholder="******">
                    <mat-icon matSuffix>lock</mat-icon>
                </mat-form-field>
            </div>

            <div class="btn-area">
                <div>
                    <button class="primary-button" mat-raised-button color="primary" (click)="changePassword()">Alterar
                        senha</button>
                </div>
            </div>
        </form>
    </div>

</div>
